apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-dashboard
spec:
  replicas: 1
  template:
    spec:
      serviceAccountName: rollout-dashboard
      containers:
        - name: rollout-dashboard
          image: ko://github.com/kuberik/rollout-dashboard
          ports:
            - containerPort: 8080
          env:
            # Optional human-readable cluster name shown in multi-cluster UI.
            # User can create a kuberik-cluster-info ConfigMap with `name` key to populate.
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: kuberik-cluster-info
                  key: name
                  optional: true
            # Optional external URL of this dashboard. Required for correct self-exclusion
            # during multi-cluster fan-out when behind a reverse proxy that does not
            # forward Host headers. Set via the same kuberik-cluster-info ConfigMap.
            - name: DASHBOARD_URL
              valueFrom:
                configMapKeyRef:
                  name: kuberik-cluster-info
                  key: url
                  optional: true
            # Dev-only: skip TLS verification when calling spoke dashboards.
            # Use only in kind/dev where each cluster has its own self-signed cert.
            - name: INSECURE_SKIP_TLS_VERIFY
              valueFrom:
                configMapKeyRef:
                  name: kuberik-cluster-info
                  key: insecureSkipTLSVerify
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: rollout-dashboard
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollout-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollout-controller-manager-role
subjects:
  - kind: ServiceAccount
    name: rollout-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rollout-dashboard-view
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollout-dashboard-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollout-dashboard-view
subjects:
  - kind: ServiceAccount
    name: rollout-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rollout-dashboard-rollouts-patch
rules:
  - apiGroups: ["rollouts.kruise.io"]
    resources: ["rollouts", "rollouts/status"]
    verbs: ["patch", "update"]
  - apiGroups: ["rollout.kuberik.com"]
    resources: ["rollouttests/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollout-dashboard-rollouts-patch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollout-dashboard-rollouts-patch
subjects:
  - kind: ServiceAccount
    name: rollout-dashboard
