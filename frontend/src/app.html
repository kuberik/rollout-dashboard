<!doctype html>
<html lang="%paraglide.lang%">

<head>
	<meta charset="utf-8" />
	<!--
		⭐ THE FIRST FRAME, BEFORE THE APP EXISTS. (Operator-walk finding 21)
		Throttling `**/api/**` and hard-loading `/apps` showed a full-brightness
		WHITE screen for the whole wait even with the theme persisted as dark —
		`document.body.innerText` was empty and `html` carried no `dark` class,
		because `theme.init()` only runs from `Navbar.svelte`'s `onMount`, which
		cannot fire until Svelte has parsed, compiled and mounted the app. On a
		cold SPA load (no SSR — see `+layout.ts`) that window is real, not a
		one-frame flicker, and someone opening a link from an alert at 3am reads
		it as "is this down?" not "this is loading."

		This is the ONLY thing that can beat that race: synchronous, blocking,
		before any paint, before the stylesheet or the framework. It reads the
		exact key `theme.ts` writes (`localStorage['theme']`) and the same
		`prefers-color-scheme` fallback, so it can never disagree with the
		store once `theme.init()` runs — that call becomes a no-op re-assertion
		on the happy path, not a correction.

		⚠️ `background-color` is set on `<html>`, not assumed from a stylesheet
		that has not loaded yet. `oklch(0.21 0.034 264.665)` is Tailwind's own
		`gray-900` (`node_modules/tailwindcss/theme.css`), read via
		`getComputedStyle` off the running shell rather than guessed, so it is
		pixel-identical to the `dark:bg-gray-900` the shell paints on top of it
		one frame later — the swap is invisible even under a slow mount.
	-->
	<script>
		(function () {
			try {
				/*
					⭐ `?theme=light|dark` SETS THE THEME — DEMO BUILDS ONLY.
					(2026-09-12) The kuberik.com showcases need it: the landing is
					light everywhere, its iframes cannot reach inside the demo build
					to press the toggle, and a visitor whose OS is dark would
					otherwise get a dark dashboard inside a light page.

					⛔ AND IT IS GATED, BECAUSE IT PERSISTS. It writes the same key
					the toggle writes — which is the only thing that makes the choice
					survive the next navigation, since the query string does not — so
					on a REAL dashboard a shared link carrying `?theme=dark` would
					silently overwrite a colleague's saved preference, with no UI
					anywhere saying why their dashboard changed. That is a fine trade
					inside an iframe nobody owns and a bad one on the dashboard people
					live in. `PUBLIC_DEMO` is set only by `scripts/build-demo.sh`;
					everywhere else this replaces with an empty string and the whole
					branch is dead.
				*/
				var demo = '%sveltekit.env.PUBLIC_DEMO%' === '1';
				if (demo) {
					var forced = new URLSearchParams(location.search).get('theme');
					if (forced === 'light' || forced === 'dark') localStorage.setItem('theme', forced);
				}
				var stored = localStorage.getItem('theme');
				var prefersDark =
					window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
				var dark = stored ? stored === 'dark' : prefersDark;
				var html = document.documentElement;
				html.style.colorScheme = dark ? 'dark' : 'light';
				html.style.backgroundColor = dark ? 'oklch(0.195 0.014 222)' : 'oklch(0.975 0.004 222)';
				if (dark) html.classList.add('dark');
			} catch (e) {
				/* localStorage/matchMedia unavailable — fall back to the light shell. */
			}
		})();
	</script>
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/logo.svg" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="preload" href="/fonts/inter-latin-opsz.woff2" as="font" type="font/woff2" crossorigin>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
