apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../common
  - approval-policy.yaml
namespace: hello-world-prod-eu-west

patches:
  # Site/wave placement (environment-controller "Sites and waves").
  - target:
      kind: Environment
    patch: |-
      - op: add
        path: /spec/site
        value: eu-west
      - op: add
        path: /spec/wave
        value: 1

  # Common manifests are built from the prod artifact, which hard-codes
  # namespace hello-world-prod; deploy each site into its own namespace.
  - target:
      kind: Kustomization
      group: kustomize.toolkit.fluxcd.io
    patch: |-
      - op: add
        path: /spec/targetNamespace
        value: hello-world-prod-eu-west
  - target:
      kind: Rollout
      name: hello-world-app
    patch: |-
      - op: replace
        path: /metadata/annotations/dashboard.rollout.kuberik.com~1description
        value: "Hello World app / prod eu-west"
  # Opt this Rollout into the ApprovalPolicy above.
  - target:
      kind: Rollout
      name: hello-world-app
    patch: |-
      apiVersion: kuberik.com/v1alpha1
      kind: Rollout
      metadata:
        name: hello-world-app
        labels:
          approval.kuberik.com/required: "true"
