apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: hello-second-staging

labels:
  - pairs:
      environment: staging
    includeSelectors: true
    includeTemplates: true

replacements:
  - sourceValue: staging
    targets:
      - select:
          kind: Rollout
        fieldPaths:
          - metadata.annotations.[dashboard.rollout.kuberik.com/description]
        options:
          delimiter: " "
          index: 4
      - select:
          kind: Rollout
        fieldPaths:
          - metadata.annotations.[dashboard.rollout.kuberik.com/theme]
      - select:
          kind: ReleaseSource
          name: hello-second-manifests
        fieldPaths:
          - spec.oci.image
        options:
          delimiter: "/"
          index: 3
      - select:
          kind: OCIRepository
          name: hello-second
        fieldPaths:
          - spec.url
        options:
          delimiter: "/"
          index: 5
      - select:
          kind: Environment
        fieldPaths:
          - spec.environment
        options:
          create: true
patches:
  - patch: |-
      apiVersion: environments.kuberik.com/v1alpha1
      kind: Environment
      metadata:
        name: hello-second-app
      spec:
        relationship:
          environment: dev
          type: After
  - patch: |-
      apiVersion: environments.kuberik.com/v1alpha1
      kind: Environment
      metadata:
        name: hello-second-manifests
      spec:
        relationship:
          environment: dev
          type: After
