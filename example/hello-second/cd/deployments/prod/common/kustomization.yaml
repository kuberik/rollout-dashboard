apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base

namespace: hello-second-prod

labels:
  - pairs:
      environment: prod
    includeSelectors: true
    includeTemplates: true

replacements:
  - sourceValue: prod
    targets:
      - select:
          kind: Rollout
        fieldPaths:
          - metadata.annotations.[dashboard.rollout.kuberik.com/description]
        options:
          delimiter: " "
          index: 4
      - select:
          kind: Rollout
        fieldPaths:
          - metadata.annotations.[dashboard.rollout.kuberik.com/theme]
      - select:
          kind: ReleaseSource
          name: hello-second-manifests
        fieldPaths:
          - spec.oci.image
        options:
          delimiter: "/"
          index: 3
      - select:
          kind: OCIRepository
          name: hello-second
        fieldPaths:
          - spec.url
        options:
          delimiter: "/"
          index: 5
      - select:
          kind: Environment
        fieldPaths:
          - spec.environment
        options:
          create: true
