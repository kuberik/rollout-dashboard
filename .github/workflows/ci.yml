name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Frontend unit tests (vitest: jsdom "client" + node "server" projects; no
  # browsers needed). Separate job so it runs in parallel with the build/ko/Go
  # job and shows up as its own stable check name for branch protection.
  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # `prepare` already runs this on install; kept explicit so the generated
      # .svelte-kit/tsconfig.json exists even if scripts are ever disabled.
      - name: Svelte-kit sync
        working-directory: frontend
        run: pnpm exec svelte-kit sync

      # The paraglide plugin in vite.config.ts compiles src/lib/paraglide on
      # vitest startup, so no separate compile step is needed.
      - name: Run frontend tests
        working-directory: frontend
        run: pnpm exec vitest run

      # svelte-check needs the compiled paraglide module, otherwise every
      # `$lib/paraglide` import reports as a phantom error.
      - name: Compile paraglide
        working-directory: frontend
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Svelte-check
        working-directory: frontend
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json --threshold error

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.2"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm run build
          rm -rf ../kodata
          cp -r build ../kodata

      - name: Set up ko
        uses: ko-build/setup-ko@v0.9
        with:
          ko-version: "0.18.0"

      - name: Install kustomize
        # A pinned release tarball, checksum-verified. The upstream install script asks
        # api.github.com for the latest release without a token, and GitHub's rate
        # limit fails the job (e.g. rollout-dashboard #201 on 2026-11-26).
        env:
          KUSTOMIZE_VERSION: v5.8.0
          KUSTOMIZE_SHA256: 4dfa8307358dd9284aa4d2b1d5596766a65b93433e8fa3f9f74498941f01c5ef
        run: |
          tarball="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${tarball}"
          echo "${KUSTOMIZE_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" kustomize
          sudo mv kustomize /usr/local/bin/
          rm "$tarball"

      - name: Test ko build
        run: |
          export KO_DOCKER_REPO=ko.local
          export KO_DATA_PATH=kodata

          # Test that ko can build the image (without pushing)
          ko build --bare . --push=false

      - name: Test kustomize build
        run: |
          # Test that kustomize can build the manifests
          kustomize build deploy/prod

      - name: Run Go tests
        run: |
          # Check if there are any Go test files
          if find . -name "*_test.go" | grep -q .; then
            go test -v ./...
          else
            echo "No Go test files found, skipping tests"
          fi

      - name: Run Go vet
        run: go vet ./...
