name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.2"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm install
          pnpm run build
          rm -rf ../kodata
          cp -r build ../kodata

      - name: Set up ko
        uses: ko-build/setup-ko@v0.9
        with:
          ko-version: "0.18.0"

      - name: Install kustomize
        # A pinned release tarball, checksum-verified. The upstream install script asks
        # api.github.com for the latest release without a token, and GitHub's rate
        # limit fails the job (e.g. rollout-dashboard #201 on 2026-11-26).
        env:
          KUSTOMIZE_VERSION: v5.8.0
          KUSTOMIZE_SHA256: 4dfa8307358dd9284aa4d2b1d5596766a65b93433e8fa3f9f74498941f01c5ef
        run: |
          tarball="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${tarball}"
          echo "${KUSTOMIZE_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" kustomize
          sudo mv kustomize /usr/local/bin/
          rm "$tarball"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image and generate Kubernetes manifests
        run: |
          export KO_DOCKER_REPO=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          export KO_DATA_PATH=kodata

          # Generate manifests with ko
          kustomize build deploy/prod | ko resolve --tags ${{ steps.version.outputs.version }} --bare -f - > manifests.yaml

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          draft: false
          # A tag with a pre-release suffix (v0.9.1-rc.0, v1.0.0-beta.2) must
          # not be published as a normal release: GitHub would show it as
          # "Latest" and anyone following the repo's releases would take a
          # release candidate for the stable one. SemVer puts that suffix
          # after a hyphen, and a plain release tag never contains one.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

      - name: Upload manifests to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./manifests.yaml
          asset_name: kubernetes-manifests.yaml
          asset_content_type: application/x-yaml

      - name: Output release info
        run: |
          echo "Release ${{ steps.version.outputs.version }} created successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          echo "Manifests and deployment files uploaded to release assets"
