kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    metadata:
      name: config
    apiServer:
      extraArgs:
        oidc-issuer-url: https://dex-server:10443/dex
        oidc-client-id: kuberik-cluster
        oidc-username-claim: email
        oidc-groups-claim: groups
        oidc-ca-file: /usr/local/share/ca-certificates/dex-ca.crt
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30951
        hostPort: __HOST_PORT__
        protocol: TCP
    extraMounts:
      # Mount the CA certificate for HTTPS
      - hostPath: /tmp/dex-ca.crt
        containerPath: /usr/local/share/ca-certificates/dex-ca.crt
      - hostPath: /tmp/dex-ca.crt
        containerPath: /usr/share/ca-certificates/mozilla/dex-ca.crt
      - hostPath: /tmp/dex-ca.crt
        containerPath: /usr/share/ca-certificates/dex-ca.crt
      - hostPath: /tmp/dex-ca.crt
        containerPath: /etc/ssl/certs/dex-ca.crt
