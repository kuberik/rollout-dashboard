# SNI-based TCP router on host:443 for multi-cluster kind dev.
# Routes TLS traffic to the right kind cluster (or to vite) based on SNI:
#   SNI=kuberik.<host>.nip.io       → <host IP>:5173 (vite, hub frontend)
#   SNI=kuberik-spoke.<host>.nip.io → <host IP>:8081 (kind spoke Envoy)
#
# Replaces docker-compose.socat.yaml in multi-cluster mode. haproxy.cfg is
# templated by setup-multi-cluster-dev.sh into ~/.local/state/kuberik-dev before
# this compose runs. Not /tmp: the router restarts after a reboot, and a
# vanished /tmp file came back as an empty directory that haproxy cannot read.
#
# The backends are the host IP, not host.docker.internal: Docker can resolve
# host-gateway to "invalid IP" (seen on 29.1.3 after a daemon restart), and
# haproxy then exits on start.
#
# A fixed project name keeps `up`/`down` working from any checkout or worktree.
name: kuberik-sni

services:
  sni-router:
    image: haproxy:2.9-alpine
    container_name: sni-router
    ports:
      - "443:443"
    volumes:
      - ${HOME}/.local/state/kuberik-dev/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
